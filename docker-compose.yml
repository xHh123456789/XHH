services:
  # 1. MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: order-mysql
    restart: always
    environment:
      # 本地开发用默认值 123456；服务器上通过 .env 文件注入强密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-work_order_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. FastAPI 后端服务
  backend:
    build: .
    container_name: order-backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-work_order_db}
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-key}

# 3. Vue 前端（Nginx）
  frontend:
    build: ./frontend
    container_name: order-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

# 4. 数据卷：持久化 MySQL 数据
volumes:
  mysql_data:

